<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bank al Etihad Christmas Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400&family=IBM+Plex+Sans+Arabic:wght@400&display=swap">
<style>
/* Layout: one centred column on white. Wordmark top (right in Arabic), reel in the middle
   framed by a slowly turning blurred-orange gradient, one round orange button under it.
   Palette = BAE Tier 01/02 tokens only. One weight (Regular). 7% side margins. */
:root {
  --white: #FFFFFF;
  --orange: #FA6428;
  --orange-dark: #C13A23;
  --orange-medium: #FB9A75;
  --orange-soft: #FDCBB4;
  --orange-light: #FFFAF4;
  --stone-light: #ECE8DF;
  --stone: #CCC3B4;
  --ink: #19181E;
  --ink-medium: #4F4E62;
  --ink-light: #75738D;
  --burgundy-light: #F1C0B6;

  --font-en: "GT Walsheim", "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --font-ar: "Avenir Arabic", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font: var(--font-ar);

  --margin: 7vw;
  --row: 136px;
  --rows: 2.7;
  color-scheme: light;
}
:root[lang="en"] { --font: var(--font-en); }
html, body { height: 100%; }
html { overflow-x: clip; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 400;
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; font-weight: 400; }
button, input, textarea { font: inherit; color: inherit; }

.page {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px), var(--margin));
  padding-right: max(16px, env(safe-area-inset-right, 0px), var(--margin));
  padding-block: max(16px, min(var(--margin), 5vh));
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
/* Official lockups from the BAE logo file, used as supplied (black on white = approved monochrome pair) */
.wordmark { min-width: 0; display: flex; align-items: center; color: #000; }
.logo { display: block; height: 36px; width: auto; max-width: 100%; }
:root[lang="ar"] .logo-en, :root:not([lang="ar"]) .logo-ar { display: none; }
.tools { display: flex; gap: 8px; }
.chip {
  height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px;
  border: 1px solid var(--stone-light); background: var(--white); color: var(--ink-medium);
  font-size: 16px; line-height: 1.2; letter-spacing: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; transition: border-color .15s, color .15s, background .15s;
}
.chip:hover { border-color: var(--stone); color: var(--ink); }
.chip svg { width: 18px; height: 18px; }
.chip[aria-pressed="false"] .on { display: none; }
.chip[aria-pressed="true"] .off { display: none; }

/* Stage */
.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 3.6vh, 36px); padding-block: 24px; text-align: center; }
.headline { margin: 0; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; color: var(--ink); }
.intro { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Reel */
.reel-wrap { position: relative; width: min(100%, 680px); }
.glow { position: absolute; inset: -4% -8%; pointer-events: none; z-index: 0; filter: blur(56px); opacity: .45; transition: opacity .9s linear; }
.glow i { position: absolute; border-radius: 50%; animation: turn 30s linear infinite; }
.glow i:nth-child(1) { width: 62%; height: 70%; left: 4%; top: 12%; background: var(--orange-soft); transform-origin: 70% 40%; }
.glow i:nth-child(2) { width: 46%; height: 56%; right: 6%; top: 22%; background: var(--burgundy-light); transform-origin: 30% 60%; animation-duration: 30s; }
.glow i:nth-child(3) { width: 38%; height: 40%; left: 30%; bottom: 4%; background: var(--orange-medium); transform-origin: 50% 20%; opacity: .7; }
@keyframes turn { to { transform: rotate(360deg); } }
.is-won .glow { opacity: .8; }

.reel {
  position: relative; z-index: 1;
  height: calc(var(--row) * var(--rows));
  border-radius: 28px;
  background: rgba(255,255,255,.82);
  box-shadow: 0 1px 0 rgba(25,24,30,.04), 0 18px 48px -24px rgba(25,24,30,.18);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 34%, #000 66%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 34%, #000 66%, transparent 100%);
}
.reel::before { /* centre window */
  content: ""; position: absolute; left: 16px; right: 16px; top: 50%; height: calc(var(--row) - 8px);
  transform: translateY(-50%); border-radius: 999px; background: var(--orange-light);
  border: 1px solid var(--orange-soft); transition: background .4s, border-color .4s;
}
.is-won .reel::before { background: var(--orange); border-color: var(--orange); }
.slot {
  position: absolute; left: 0; right: 0; top: 50%; height: var(--row); margin-top: calc(var(--row) / -2);
  display: flex; align-items: center; justify-content: center; padding: 0 44px;
  font-size: 24px; line-height: 1.1; letter-spacing: 0;
  overflow: hidden;
  will-change: transform, opacity; color: var(--ink);
}
.slot.center { color: var(--ink); }
.is-won .slot.center { color: var(--white); }
.slot-text { transition: filter .9s cubic-bezier(.2,.7,.2,1), opacity .9s; }
.is-idle .slot-text { filter: blur(10px); opacity: .7; }
.slot-text { font-family: var(--font-en); unicode-bidi: plaintext; max-width: 30em; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }

/* Result line */
.result { position: relative; z-index: 2; min-height: 28px; font-size: 18px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink-medium); }
.result .w { display: inline-block; animation: textIn 900ms cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 75ms); }
.result .hl { color: var(--orange-dark); }
.result.out { animation: textOut 900ms linear both; }
@keyframes textIn { from { opacity: 0; filter: blur(20px); transform: translateY(10px); } to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes textOut { to { opacity: 0; filter: blur(20px); } }

/* Main button */
.go {
  position: relative; z-index: 2; min-width: 200px; height: 64px; border-radius: 999px; border: 0; white-space: nowrap; cursor: pointer;
  background: var(--orange); color: var(--white); font-size: 24px; line-height: 1.1; letter-spacing: 0; padding: 0 40px;
  box-shadow: 0 14px 32px -12px rgba(250,100,40,.6);
  transition: transform .18s cubic-bezier(.2,.7,.2,1), background .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
}
.go::after { content: ""; position: absolute; inset: -8px; border-radius: 999px; border: 1px solid var(--orange-soft); transition: inset .3s, opacity .3s; }
.go:not(:disabled):not(.spinning):hover::after { inset: -12px; border-color: var(--orange-medium); }
.go:active { transform: scale(.96); }
.go[aria-disabled="true"] { cursor: default; }
.go.spinning { background: var(--ink); box-shadow: 0 14px 32px -12px rgba(25,24,30,.5); }
.go.spinning::after { border-color: var(--stone); animation: ring 1.2s linear infinite; }
.go:disabled { cursor: default; background: var(--stone-light); color: var(--ink-medium); box-shadow: none; font-size: 18px; letter-spacing: -0.02em; }
.go:disabled::after { opacity: 0; }
@keyframes ring { 0% { inset: -6px; opacity: 1; } 100% { inset: -16px; opacity: 0; } }
.go:focus-visible, .chip:focus-visible, .btn:focus-visible, textarea:focus-visible, input:focus-visible + .switch { outline: 2px solid var(--ink); outline-offset: 4px; }
.hint { font-size: 12px; line-height: 1.2; letter-spacing: .01em; color: var(--ink-light); }
kbd { font-family: var(--font-en); font-size: 12px; padding: 2px 6px; border: 1px solid var(--stone-light); border-radius: 6px; }

/* Footer */
.foot { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; line-height: 1.2; letter-spacing: 0.01em; color: var(--ink-light); flex-wrap: wrap; }
.history { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.history span { unicode-bidi: plaintext; font-family: var(--font-en); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 10px; border-radius: 12px; background: var(--orange-light); color: var(--ink-medium); }

/* Settings sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(25,24,30,.24); z-index: 20; opacity: 0; transition: opacity .25s; }
.sheet-back.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 21; top: 0; bottom: 0; inset-inline-end: 0; width: min(420px, 100%);
  background: var(--white); display: flex; flex-direction: column; gap: 20px;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 28px calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 0 64px rgba(25,24,30,.16); transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.7,.2,1);
}
:root[dir="rtl"] .sheet { transform: translateX(-100%); }
.sheet.open { transform: none !important; }
.sheet h2 { margin: 0; font-size: 24px; line-height: 1.1; letter-spacing: 0; }
.sheet label.field { display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.2; color: var(--ink-medium); flex: 1; min-height: 0; }
.sheet textarea {
  flex: 1; min-height: 200px; resize: none; border: 1px solid var(--stone-light); border-radius: 16px; padding: 16px;
  font-size: 16px; line-height: 1.2; background: var(--white); color: var(--ink);
}
.sheet .note { font-size: 12px; color: var(--ink-light); line-height: 1.2; letter-spacing: 0.01em; }
.sheet textarea { padding-block: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 1.2; color: var(--ink-medium); cursor: pointer; }
.row input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 44px; height: 26px; border-radius: 13px; background: var(--stone-light); box-shadow: inset 0 0 0 1px var(--ink-light); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(25,24,30,.2); transition: transform .2s; }
.row input:checked + .switch { background: var(--orange); box-shadow: none; }
.row input:checked + .switch::after { transform: translateX(18px); }
:root[dir="rtl"] .row input:checked + .switch::after { transform: translateX(-18px); }
.actions { display: flex; gap: 10px; }
.round { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; background: var(--orange-light); }
.round-text { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; font-size: 16px; line-height: 1.2; color: var(--ink); }
.round .note { font-size: 12px; line-height: 1.2; letter-spacing: 0.01em; color: var(--ink-medium); }
.btn.small { flex: none; height: 44px; padding: 0 18px; }
.btn { flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--stone-light); background: var(--white); cursor: pointer; font-size: 16px; line-height: 1.2; letter-spacing: 0; color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--white); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 560px) {
  :root { --row: 136px; }
  .is-won .reel::before { background: var(--orange-dark); border-color: var(--orange-dark); }
  .headline { font-size: 32px; }
  .reel::before { left: 8px; right: 8px; }
  .slot { padding: 0 36px; font-size: 18px; letter-spacing: -0.02em; }
  .go { height: 56px; min-width: 180px; padding: 0 32px; }
  .logo { height: 28px; }
  .hint { display: none; }
}
@media (max-width: 420px) {
  .chip { padding: 0 12px; }
  .tools { gap: 6px; }
  #editBtn [data-t="edit"] { display: none; }
  #fsBtn { display: none; }
}
@media (max-height: 860px) and (min-width: 561px) { :root { --row: 124px; } }
@media (max-height: 700px) { :root { --row: 128px; --rows: 2.2; } .go { height: 52px; } .stage { padding-block: 12px; gap: 16px; } }
@media (max-width: 380px) { .slot { padding: 0 32px; font-size: 16px; line-height: 1.2; letter-spacing: 0; } }
@media (prefers-reduced-motion: reduce) {
  .glow i, .go.spinning::after { animation: none; }
  .result .w, .result.out { animation-duration: 1ms; animation-delay: 0ms; }
}
</style>
</head>

        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
      </button>
      <button class="chip" id="fsBtn" type="button" aria-pressed="false" data-t-label="fullscreen" aria-label="Full screen" hidden>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
      <button class="chip" id="editBtn" type="button" aria-haspopup="dialog" data-t-label="edit" aria-label="الهدايا">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span data-t="edit">Challenges</span>
      </button>
    </div>
  </header>

  <main class="stage is-idle" id="stage">
    <div class="intro">
      <h1 class="headline" data-t="headline">Press and get your challenge</h1>
    </div>

    <div class="reel-wrap">
      <div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="reel" id="reel" aria-hidden="true"></div>
    </div>

    <div class="result" id="result" aria-live="polite"></div>

    <button class="go" id="go" type="button" data-t="start">ابدأ</button>
    <div class="hint" data-t-html="hint">أو اضغط <kbd>Space</kbd></div>
  </main>

  <footer class="foot">
    <div class="history" id="history" role="list" data-t-label="recent" aria-label="آخر النتائج"></div>
  </footer>
</div>

<div class="sheet-back" id="back" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <h2 id="sheetTitle" data-t="sheetTitle">قائمة الهدايا</h2>
  <label class="field" for="giftsInput">
    <span data-t="sheetLabel">اكتب كل هدية بسطر لحالها</span>
    <textarea id="giftsInput" spellcheck="false"></textarea>
    <span class="note" data-t="sheetNote">الأسماء الموجودة هي أمثلة. التعديلات بتنحفظ على هذا الجهاز فقط.</span>
  </label>
  <div class="round">
    <div class="round-text">
      <span id="roundStatus"></span>
      <span class="note" data-t="roundNote">Each challenge comes up once per round. When all have been drawn, a new round starts by itself.</span>
    </div>
    <button class="btn small" id="newRoundBtn" type="button" data-t="newRound">New round</button>
  </div>
  <div class="actions">
    <button class="btn" id="resetBtn" type="button" data-t="reset">رجّع الأمثلة</button>
    <button class="btn primary" id="saveBtn" type="button" data-t="save">حفظ</button>
  </div>
</aside>

<script>
(() => {
  const STR = {
    ar: {
      brand: "بنك الاتحاد", eyebrow: "تحدّي سوق الميلاد", headline: "اكبس واكتشف تحدّيك",
      start: "ابدأ", stop: "وقّف", again: "لفّة جديدة", empty: "خلصت التحديات",
      hint: 'أو اضغط <kbd>Space</kbd>', edit: "التحديات", sound: "الصوت", fullscreen: "ملء الشاشة",
      won: "هذا تحدّيك. بالتوفيق!", recent: "آخر التحديات", spinning: "التحديات عم تلف… اكبس وقّف",
      count: (n) => `${n.toLocaleString("ar-EG")} ${n === 1 ? "تحدّي" : n <= 10 ? "تحديات" : "تحدّي"} بالسحب`,
      sheetTitle: "قائمة التحديات", sheetLabel: "اكتب كل تحدّي بسطر لحاله",
      sheetNote: "التعديلات بتنحفظ على هذا الجهاز فقط.",
      round: (d, n) => `طلع ${d.toLocaleString("ar-EG")} من ${n.toLocaleString("ar-EG")} بهاي الجولة`,
      roundNote: "كل تحدّي بيطلع مرة وحدة بالجولة. لما يطلعوا كلهم بتبلّش جولة جديدة لحالها.", newRound: "جولة جديدة", reset: "رجّع القائمة الأصلية", save: "حفظ",
      emptyList: "ضيف تحدّي واحد على الأقل", lang: "EN"
    },
    en: {
      brand: "Bank al Etihad", eyebrow: "Christmas market challenge", headline: "Press and get your challenge",
      start: "Start", stop: "Stop", again: "Spin again", empty: "No challenges left",
      hint: 'or press <kbd>Space</kbd>', edit: "Challenges", sound: "Sound", fullscreen: "Full screen",
      won: "This is your challenge. Good luck!", recent: "Recent challenges", spinning: "Challenges are spinning… press Stop",
      count: (n) => `${n} ${n === 1 ? "challenge" : "challenges"} in the draw`,
      sheetTitle: "Challenge list", sheetLabel: "One challenge per line",
      sheetNote: "Changes are saved on this device only.",
      round: (d, n) => `${d} of ${n} drawn this round`,
      roundNote: "Each challenge comes up once per round. When all have been drawn, a new round starts by itself.", newRound: "New round", reset: "Restore original list", save: "Save",
      emptyList: "Add at least one challenge", lang: "عربي"
    }
  };
  const CHALLENGES = [
    "Find Santa and take a selfie with him.",
    "Find three nutcrackers around the market and take a photo with each.",
    "Name 5 restaurants or food vendors at the market.",
    "Find someone drinking from a Bank al Etihad cup sleeve, snap a photo, and get back to us.",
    "Find someone at the market who can name 3 Christmas songs. Get them to say all 3 on video.",
    "Find an item shaped like a star, a snowflake, and a Christmas tree. Take a photo of each.",
    "Gather 3 random people for a Christmas group photo. Bonus points if everyone’s wearing something festive.",
    "Find someone random to sing a verse of a Christmas song with you. Or find 2 other visitors and get all 3 of you to sing one Christmas song together.",
    "Name 5 vendors at the market that sell something sweet.",
    "Find the 3 different Christmas decorations and take a selfie with each.",
    "Find the smallest item being sold at the market. Bring back a photo with the vendor’s name.",
    "Find items with each of these colours: red, green, gold, and silver. Return with 4 photos.",
    "Find a stranger at the market and exchange your best Christmas greeting.",
    "Visit a vendor and ask them to show you their favorite item.",
    "Ask a vendor to teach you something in 30 seconds. It could be a craft, a trick, or a skill.",
    "Name 5 things you’d bring to a Christmas gathering in 15 seconds.",
    "Get your group to pose as a Christmas-card family portrait.",
    "Create a 3-step Christmas handshake with someone at the market.",
    "The host names 5 Christmas-related words. Repeat them backwards, in reverse order.",
    "Describe a Christmas movie or character in 15 seconds.",
    "Say “Santa’s seven silver sleigh bells” three times correctly without stumbling."
  ];
  const SAMPLE = { ar: CHALLENGES, en: CHALLENGES };

  const store = {
    get(k, d) { try { const v = localStorage.getItem("bae-challenge:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("bae-challenge:" + k, JSON.stringify(v)); } catch {} }
  };

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const reel = $("reel"), go = $("go"), result = $("result"), stage = $("stage");
  const historyEl = $("history"), countEl = $("count");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");

  let lang = store.get("lang", "en");
  let custom = store.get("gifts", null);           // null → use the examples of the current language
  // Shuffle bag: every challenge is drawn once per round; the bag refills itself, reshuffled.
  let bag = store.get("bag", null);
  let lastDrawn = store.get("last", null);
  let sound = store.get("sound", true);
  let gifts = [];
  let history = [];

  // Reel state: p = position in rows (float). Item under the centre line = round(p) mod n.
  let p = 0, v = 0.6;                 // v in rows / second (idle drift)
  let mode = "idle";                  // idle | accel | spin | stopping | won
  let accelFrom = 0, accelT0 = 0;
  let stopFrom = 0, stopDist = 0, stopT0 = 0, stopDur = 0, stopK = 3;
  let landRow = null, landGift = null; // the row the reel stops on shows the drawn gift
  let stopQueued = false;
  const VMAX = 20, ACCEL_MS = 700, IDLE_V = 0.6;

  const SLOTS = 7;
  const slotEls = [];
  for (let i = 0; i < SLOTS; i++) {
    const s = document.createElement("div");
    s.className = "slot";
    const t = document.createElement("span"); t.className = "slot-text";
    s.appendChild(t); reel.appendChild(s); slotEls.push(s);
  }

  function rowPx() { return parseFloat(getComputedStyle(root).getPropertyValue("--row")) || 136; }
  let ROW = rowPx();
  addEventListener("resize", () => { ROW = rowPx(); render(); });

  const mod = (a, n) => ((a % n) + n) % n;

  function setGifts() {
    gifts = (Array.isArray(custom) ? custom : SAMPLE[lang]).slice();
  }

  function render() {
    const n = gifts.length;
    const base = Math.floor(p);
    const frac = p - base;
    const blur = reduce.matches ? 0 : Math.min(Math.max(v - 4, 0) / 6, 2.2);
    const centreIdx = Math.round(p);
    for (let k = 0; k < SLOTS; k++) {
      const i = base + k - 3;                 // item index on the reel
      const d = i - p;                        // distance from centre in rows (negative = above)
      const el = slotEls[k];
      const ad = Math.abs(d);
      const text = n ? (i === landRow && landGift != null ? landGift : gifts[mod(i, n)]) : "—";
      if (el.firstChild.textContent !== text) el.firstChild.textContent = text;
      const op = Math.max(0, 1 - ad / 2.7);
      el.style.transform = `translateY(${(d * ROW).toFixed(2)}px) scale(${(1 - Math.min(ad, 3) * 0.07).toFixed(3)})`;
      el.style.opacity = (op * op * (mode === "won" && i !== centreIdx ? 0.55 : 1)).toFixed(3);
      el.style.filter = blur ? `blur(${blur.toFixed(2)}px)` : "";
      el.classList.toggle("center", i === centreIdx && ad < 0.5);
    }
  }

  // ---- Sound: a soft click per row that passes the centre line ----
  let ac = null, lastTickRow = 0, lastTickAt = 0;
  function tick(strength) {
    if (!sound || !ac) return;
    const now = ac.currentTime;
    if (now - lastTickAt < 0.035) return;
    lastTickAt = now;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = 1500 + Math.random() * 120;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.05 * strength, now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    o.connect(g).connect(ac.destination); o.start(now); o.stop(now + 0.06);
  }
  function chime() {
    if (!sound || !ac) return;
    const now = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = now + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1);
    });
  }
  function ensureAudio() {
    if (!sound) return;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch { ac = null; }
  }

  // ---- Animation loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (mode === "idle") {
      v = reduce.matches ? 0 : IDLE_V; p += v * dt;
    } else if (mode === "accel") {
      const t = Math.min((now - accelT0) / ACCEL_MS, 1);
      v = accelFrom + (VMAX - accelFrom) * (t * t);
      p += v * dt;
      if (t >= 1) mode = "spin";
      if (stopQueued && v >= 8) { stopQueued = false; stop(); }
    } else if (mode === "spin") {
      v = VMAX; p += v * dt;
    } else if (mode === "stopping") {
      const t = Math.min((now - stopT0) / stopDur, 1);
      const e = 1 - Math.pow(1 - t, stopK);
      const np = stopFrom + stopDist * e;
      v = dt > 0 ? (np - p) / dt : 0;
      p = np;
      if (t >= 1) { p = Math.round(p); v = 0; land(); }
    }
    if (landRow != null && mode !== "stopping" && mode !== "won" && Math.abs(landRow - p) > 4) { landRow = null; landGift = null; }
    if (mode !== "idle" && mode !== "won") {
      const r = Math.round(p);
      if (r !== lastTickRow) { lastTickRow = r; tick(mode === "stopping" ? 1 : 0.6); }
    }
    if (mode !== "won") render();
    requestAnimationFrame(frame);
  }

  function start() {
    if (!gifts.length) return;
    ensureAudio();
    stopQueued = false;
    stage.classList.remove("is-won", "is-idle");
    swapResult(() => { result.textContent = STR[lang].spinning; });
    if (reduce.matches) { mode = "spin"; v = VMAX; }
    else { mode = "accel"; accelFrom = v; accelT0 = performance.now(); }
    lastTickRow = Math.round(p);
    setButton();
  }

  // The winner is drawn first; the reel then glides to a row ~17 rows ahead (off screen at
  // that moment) and that row shows the drawn gift. Every gift has the same 1/n chance.
  function stop() {
    landGift = drawFromBag();
    const vNow = Math.max(v, 1);
    if (reduce.matches) {                          // no long glide: settle within half a second
      landRow = Math.ceil(p + 4);
      stopFrom = p; stopDist = landRow - p; stopDur = 500; stopK = 2;
    } else {
      landRow = Math.ceil(p + vNow * 2.6 / 3);
      stopFrom = p; stopDist = landRow - p;
      const T = Math.min(Math.max(3 * stopDist / vNow, 2.4), 4.4);
      stopDur = T * 1000;
      stopK = Math.max(1, vNow * T / stopDist);    // keeps the hand-off velocity continuous
    }
    stopT0 = performance.now();
    mode = "stopping";
    setButton();
  }

  function swapResult(fill) {                      // brand text OUT (900ms, blur) then the next text
    clearTimeout(swapTimer);
    const hasText = result.textContent.trim() !== "";
    if (!hasText || reduce.matches) { result.classList.remove("out"); fill(); return; }
    result.classList.add("out");
    swapTimer = setTimeout(() => { result.classList.remove("out"); fill(); }, 900);
  }
  let swapTimer = null;

  function showWon() {                             // brand text IN, word by word
    const words = STR[lang].won.split(" ").map((w, i, all) => [w, i === all.length - 1 || /بالتوفيق|Good|luck/.test(w) ? "hl" : ""]);
    result.replaceChildren(...words.flatMap(([w, cls], i) => {
      const sp = document.createElement("span");
      sp.className = "w" + (cls ? " " + cls : ""); sp.style.setProperty("--i", i); sp.textContent = w;
      return [sp, document.createTextNode(" ")];
    }));
  }

  function shuffled(list) {                       // Fisher–Yates with crypto randomness
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(cryptoRandom() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function cleanBag() {                           // keep only challenges that are still on the list
    if (!Array.isArray(bag)) { bag = null; return; }
    const left = gifts.slice(); const kept = [];
    for (const g of bag) { const i = left.indexOf(g); if (i > -1) { kept.push(g); left.splice(i, 1); } }
    bag = kept;
  }
  function drawFromBag() {
    cleanBag();
    if (!bag || !bag.length) {
      bag = shuffled(gifts);
      if (bag.length > 1 && bag[0] === lastDrawn) {   // no back-to-back repeat across rounds
        const j = 1 + Math.floor(cryptoRandom() * (bag.length - 1)); [bag[0], bag[j]] = [bag[j], bag[0]];
      }
    }
    const g = bag.shift();
    lastDrawn = g;
    store.set("bag", bag); store.set("last", g);
    return g;
  }
  function drawnThisRound() { cleanBag(); return bag && bag.length ? gifts.length - bag.length : 0; }
  function cryptoRandom() {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; } catch { return Math.random(); }
  }

  function land() {
    mode = "won";
    const g = landGift;
    render();
    stage.classList.add("is-won");
    clearTimeout(swapTimer); result.classList.remove("out");
    showWon(g);
    chime();
    try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch {}
    history.unshift(g); history = history.slice(0, 5); drawHistory();
    setButton();
  }

  function setButton() {
    const s = STR[lang];
    go.disabled = false;
    go.removeAttribute("aria-disabled");
    go.classList.toggle("spinning", mode === "accel" || mode === "spin" || mode === "stopping");
    if (!gifts.length) { go.textContent = s.empty; go.disabled = true; return; }
    if (mode === "accel" || mode === "spin") go.textContent = s.stop;
    else if (mode === "stopping") { go.textContent = s.stop; go.setAttribute("aria-disabled", "true"); }
    else if (mode === "won") go.textContent = s.again;
    else go.textContent = s.start;
  }

  function onGo() {
    if (mode === "idle" || mode === "won") start();
    else if (mode === "spin") stop();
    else if (mode === "accel") { if (v >= 8) stop(); else { stopQueued = true; go.setAttribute("aria-disabled", "true"); } }
  }
  go.addEventListener("click", onGo);
  addEventListener("keydown", (e) => {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.repeat) return;
    if ((e.code === "Space" || e.key === "Enter") && e.target === document.body) { e.preventDefault(); onGo(); }
  });


  function drawHistory() {
    historyEl.replaceChildren(...history.map((g) => { const s = document.createElement("span"); s.setAttribute("role", "listitem"); s.textContent = g; return s; }));
  }
  function updateCount() { if (countEl) countEl.textContent = STR[lang].count(gifts.length); }

  // ---- Language ----
  function applyLang() {
    const s = STR[lang];
    root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = lang === "ar" ? "تحدّي الميلاد من بنك الاتحاد" : "Bank al Etihad Christmas Challenge";
    document.querySelectorAll("[data-t]").forEach((el) => { const v = s[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-t-html]").forEach((el) => { el.innerHTML = s[el.dataset.tHtml]; });
    document.querySelectorAll("[data-t-label]").forEach((el) => el.setAttribute("aria-label", s[el.dataset.tLabel]));
    $("langBtn").textContent = s.lang;
    $("langBtn").setAttribute("aria-label", lang === "ar" ? "English" : "العربية");
    clearTimeout(swapTimer); result.classList.remove("out");
    if (mode === "won") showWon(landGift);
    else if (!gifts.length) result.textContent = s.empty;
    else if (mode === "accel" || mode === "spin" || mode === "stopping") result.textContent = s.spinning;
    else result.textContent = "";
    setButton(); updateCount();
  }
  $("langBtn").addEventListener("click", () => {
    if (mode === "accel" || mode === "spin" || mode === "stopping") return;
    lang = lang === "ar" ? "en" : "ar"; store.set("lang", lang);
    if (!custom) {                                   // examples follow the language; same order, so a pending removal index still holds
      setGifts();
      if (landRow != null && landGift != null) { const i = SAMPLE[lang === "ar" ? "en" : "ar"].indexOf(landGift); if (i > -1) landGift = gifts[i]; }
    }
    applyLang(); render();
  });

  // ---- Sound toggle ----
  // ---- Full screen (iPad Safari uses the webkit-prefixed API) ----
  const fsBtn = $("fsBtn");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (canFs) fsBtn.hidden = false;
  function drawFs() { fsBtn.setAttribute("aria-pressed", String(!!fsEl())); }
  fsBtn.addEventListener("click", () => {
    try {
      const r = fsEl()
        ? (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen())
        : (root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen());
      if (r && r.catch) r.catch(() => {});
    } catch {}
  });
  document.addEventListener("fullscreenchange", drawFs);
  document.addEventListener("webkitfullscreenchange", drawFs);

  const soundBtn = $("soundBtn");
  function drawSound() { soundBtn.setAttribute("aria-pressed", String(sound)); }
  soundBtn.addEventListener("click", () => { sound = !sound; store.set("sound", sound); drawSound(); if (sound) ensureAudio(); });

  // ---- Settings sheet ----
  const sheet = $("sheet"), back = $("back"), input = $("giftsInput"), roundStatus = $("roundStatus");
  function drawRound() { roundStatus.textContent = STR[lang].round(drawnThisRound(), gifts.length); }
  let lastFocus = null, hideTimer = null;
  function openSheet() {
    if (mode === "accel" || mode === "spin" || mode === "stopping") return;
    lastFocus = document.activeElement;
    clearTimeout(hideTimer);
    input.value = gifts.join("\n");
    drawRound();
    sheet.hidden = false; back.hidden = false;
    requestAnimationFrame(() => { sheet.classList.add("open"); back.classList.add("open"); input.focus(); });
  }
  function closeSheet() {
    sheet.classList.remove("open"); back.classList.remove("open");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { sheet.hidden = true; back.hidden = true; }, 300);
    lastFocus && lastFocus.focus();
  }
  $("editBtn").addEventListener("click", openSheet);
  back.addEventListener("click", closeSheet);
  $("saveBtn").addEventListener("click", () => {
    const list = input.value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (!list.length) { input.setCustomValidity(STR[lang].emptyList); input.reportValidity(); input.setCustomValidity(""); return; }
    const sameAsSample = list.join("\n") === SAMPLE[lang].join("\n");
    custom = sameAsSample ? null : list;
    store.set("gifts", custom);
    if (list.join("\n") !== gifts.join("\n")) { bag = null; store.set("bag", null); }   // a new list starts a new round
    landRow = null; landGift = null;
    setGifts(); mode = "idle"; stage.classList.remove("is-won"); stage.classList.add("is-idle"); clearTimeout(swapTimer); result.classList.remove("out"); result.textContent = "";
    updateCount(); setButton(); render(); closeSheet();
  });
  $("resetBtn").addEventListener("click", () => { input.value = SAMPLE[lang].join("\n"); });
  $("newRoundBtn").addEventListener("click", () => { bag = null; store.set("bag", null); drawRound(); });
  sheet.addEventListener("keydown", (e) => {          // keep Tab inside the sheet
    if (e.key !== "Tab") return;
    const f = [...sheet.querySelectorAll("textarea, input, button")];
    const first = f[0], lastEl = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
  });

  setGifts(); drawSound(); applyLang(); render();
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
